<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Inicial - O Jogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Conteúdo Principal Semântico -->
    <main class="tela-inicio">
        
        <!-- IMAGEM ILUSTRATIVA DO JOGO -->
        <!-- Substitua 'imagem-aventura.jpg' pelo caminho ou link real da sua imagem -->
        <img src="imagem-aventura.jpg" 
             alt="Ilustração de um portal cósmico brilhando em tons de azul e roxo no meio do espaço, representando a entrada para a aventura de Eldoria." 
             class="imagem-capa">

        <!-- Título e Subtítulo -->
        <h1 class="titulo-jogo">O Mistério de Eldoria</h1> 
        <p class="subtitulo-jogo">Uma jornada cheia de escolhas e perigos.</p>
        
        <!-- Botão com ID para controle do JavaScript -->
        <button id="btn-iniciar" class="botao-iniciar">Iniciar Aventura</button>
    </main>

    <script>
        document.getElementById('btn-iniciar').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                window.location.href = 'historia.html';
            }, 150);
        });
    </script>
</body>
</html>
